databases:
  - name: ramz-erp-db
    databaseName: erp
    user: erp
    plan: starter

services:
  - type: web
    name: ramz-erp-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ramz-erp-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_DEV_ECHO
        value: "false"
      - key: RATE_LIMIT_PER_MIN
        value: "120"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: UPLOAD_DIR
        value: uploads
