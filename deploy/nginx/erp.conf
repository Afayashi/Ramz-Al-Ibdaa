# Reverse proxy + TLS (Let's Encrypt). Replace erp.example.sa with your domain.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  server_name erp.example.sa;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name erp.example.sa;

  ssl_certificate     /etc/letsencrypt/live/erp.example.sa/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erp.example.sa/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 12m;           # uploads (MAX_UPLOAD_MB=10) + multipart overhead
  gzip on; gzip_types application/json text/css application/javascript text/html;

  location / {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
  }
  location /uploads/ { proxy_pass http://api:3000; expires 7d; add_header Cache-Control "private"; }
}
