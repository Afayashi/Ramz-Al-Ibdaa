# Production overlay:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    ports: !reset []                      # only reachable through nginx
    environment:
      NODE_ENV: production
    deploy: { resources: { limits: { memory: 768m } } }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  db:
    ports: !reset []
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/erp.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    volumes: [certs:/etc/letsencrypt, acme:/var/www/certbot]
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"

  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGHOST: db
      PGUSER: erp
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      PGDATABASE: erp
      RETENTION_DAYS: "30"
    volumes: [./deploy/backup:/scripts:ro, backups:/backups]
    entrypoint: /bin/sh -c "while :; do sh /scripts/backup.sh || echo '[backup] FAILED'; sleep 86400; done"

volumes:
  certs:
  acme:
  backups:
